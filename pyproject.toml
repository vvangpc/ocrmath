# `version` is the single source of the release version: build.spec feeds it
# to the installer, and CI refuses a tag that doesn't match it.
# Runtime dependencies live in requirements.txt (read below), so the two
# lists can't drift apart.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrmath"
version = "1.2.1"
description = "Mathpix OCR desktop tool: screenshot formula recognition + PDF to Markdown"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "vvangpc" }]
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/vvangpc/ocrmath"

[project.optional-dependencies]
build = ["pyinstaller"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
